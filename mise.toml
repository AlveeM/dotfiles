# Bootstrap project for this dotfiles repo. Apply with:
#   mise bootstrap --from <repo-url> --from-dir ~/.zsh               (base tools only)
#   mise -E personal bootstrap --from <repo-url> --from-dir ~/.zsh   (personal machines)
#   mise -E work bootstrap --from <repo-url> --from-dir ~/.zsh       (work machines)
# See bootstrap.sh and README.md.

# apt entries are skipped where apt-get is missing (macOS). "latest" accepts whatever
# Ubuntu provides; update on purpose with `mise bootstrap packages upgrade`.
[bootstrap.packages]
"apt:zsh" = "latest"
"apt:git" = "latest"
"apt:curl" = "latest"
"apt:ca-certificates" = "latest"
"apt:build-essential" = "latest"
"apt:unzip" = "latest"
# Compile fallbacks, needed only when mise builds Ruby/Python from source.
"apt:libssl-dev" = "latest"
"apt:libffi-dev" = "latest"
"apt:zlib1g-dev" = "latest"
"apt:libyaml-dev" = "latest"
"apt:libreadline-dev" = "latest"
# JetBrains Mono Nerd Font for starship and eza --icons (macOS; manual on Ubuntu).
"brew-cask:font-jetbrains-mono-nerd-font" = { os = "macos" }

[bootstrap.user]
login_shell = "/bin/zsh"

# Symlinks into $HOME; relative sources are relative to this file.
[dotfiles]
"~/.zshrc"                            = { source = "zshrc" }
"~/.zprofile"                         = { source = "zprofile" }
"~/.gitconfig"                        = { source = "config/gitconfig" }
"~/.config/starship.toml"             = { source = "config/starship.toml" }
"~/.config/helix/config.toml"         = { source = "config/helix/config.toml" }
"~/.config/helix/languages.toml"      = { source = "config/helix/languages.toml" }
"~/.config/ghostty/config"            = { source = "config/ghostty/config" }
"~/.config/mise/config.toml"          = { source = "config/mise/config.toml" }
"~/.config/mise/config.personal.toml" = { source = "config/mise/config.personal.toml" }
"~/.config/mise/config.work.toml"     = { source = "config/mise/config.work.toml" }
"~/.config/mise/mise.lock"            = { source = "config/mise/mise.lock" }

# Runs on every `mise bootstrap`, so it must stay idempotent: setup-plugins.zsh
# re-pins every plugin to the `pin:` SHA in plugins/plugins.txt.
[tasks.bootstrap]
run = "zsh ~/.zsh/plugins/setup-plugins.zsh"
