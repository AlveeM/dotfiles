"$schema" = 'https://starship.rs/config-schema.json'

add_newline = false
# Increase timeout for large repositories
command_timeout = 7000
scan_timeout = 30

# Use environment variable to select palette dynamically, fallback to mocha
palette = "catppuccin_mocha"

format = """
$directory\
$git_branch\
$git_status\
$fill\
$nodejs\
$python\
$golang\
$rust\
$c\
$cmd_duration\
$line_break\
$character
"""

[fill]
symbol = " "

[character]
success_symbol = "[❯](fg:green bold)"
error_symbol = "[❯](fg:red bold)"
vimcmd_symbol = "[❮](fg:blue bold)"

[directory]
style = "fg:blue bold"
truncate_to_repo = true
truncation_length = 3
# fish_style_pwd_dir_length = 1
read_only = " "
read_only_style = "fg:peach bold"

[git_branch]
symbol = " "
style = "fg:mauve bold"

[git_commit]
tag_symbol = '  '

[git_status]
style = "fg:maroon"
format = "([\\[$all_status$ahead_behind\\]]($style) )"
conflicted = "✖"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?"
stashed = "≡"
modified = "!"
staged = "+"
renamed = "»"
deleted = "✘"

[nodejs]
symbol = " "
style = "fg:green"
detect_extensions = ["ts", "tsx", "js", "mjs", "cjs"]
format = "[$symbol($version )]($style)"

[python]
symbol = " "
style = "fg:yellow"
python_binary = ["python3", "python"]
format = "[$symbol$virtualenv($version )]($style)"
detect_extensions = ["py"]
detect_files = ["pyproject.toml", "requirements.txt", ".venv"]

[golang]
symbol = " "
style = "fg:sky"
format = "[$symbol($version )]($style)"

[rust]
symbol = "󱘗 "
style = "fg:peach"
format = "[$symbol($version )]($style)"

[c]
symbol = ""
style = "fg:sapphire"
format = "[$symbol($version )]($style)"

[cmd_duration]
min_time = 1500
format = "[⏱ $duration](fg:overlay1)"

[package]
disabled = true
[aws]
disabled = true
[gcloud]
disabled = true
[docker_context]
disabled = true

